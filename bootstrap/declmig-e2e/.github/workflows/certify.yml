name: Production exact-head certification

on:
  workflow_dispatch:
  schedule:
    - cron: '11 5 * * *'

permissions:
  contents: read

concurrency:
  group: exact-head-${{ github.repository }}
  cancel-in-progress: false

jobs:
  postgres:
    strategy:
      fail-fast: false
      matrix:
        version: ['16', '17']
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:${{ matrix.version }}
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: '1.97.1'
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
      - env:
          DECLMIG_ENGINE: postgres-${{ matrix.version }}
          DPM_TEST_DATABASE_URL: postgres://postgres@localhost:5432/postgres
        run: ./scripts/run-certification.sh

  cockroach:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: '1.97.1'
      - run: docker run --detach --name declmig-crdb --publish 26257:26257 cockroachdb/cockroach:v25.2.4 start-single-node --insecure
      - run: |
          for _ in {1..60}; do
            docker exec declmig-crdb cockroach sql --insecure --host=localhost:26257 --execute='SELECT 1' >/dev/null 2>&1 && exit 0
            sleep 2
          done
          docker logs declmig-crdb
          exit 1
      - env:
          DECLMIG_ENGINE: cockroach-25.2.4
          DPM_TEST_COCKROACH_DATABASE_URL: postgresql://root@localhost:26257/defaultdb?sslmode=disable
        run: ./scripts/run-certification.sh
      - if: always()
        run: docker rm -f declmig-crdb >/dev/null 2>&1 || true
