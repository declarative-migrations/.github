name: Contract CI

on: [pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python3 scripts/verify-pins.py
      - run: python3 -m json.tool contracts/runtime-ownership.json >/dev/null
      - run: python3 -m json.tool contracts/release-gate.json >/dev/null
      - run: find scripts -type f -name '*.sh' -print0 | xargs -0 -r -n1 bash -n
